<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Volleyball Live</title>
<style>

:root{
  --navy:#07111f;--navy2:#10233a;--gold:#f5c451;--blue:#36b6f4;--red:#ff647c;
  --muted:#9fb2c8;--line:rgba(173,199,228,.16);--panel:rgba(16,34,56,.88);
  --glow:0 18px 48px rgba(0,0,0,.32)
}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -20%,#1b3c60 0%,#0a1728 48%,#060d18 100%);color:#f7fbff;font:15px Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial}
button,input,select{font:inherit}
button{border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:12px 16px;background:linear-gradient(180deg,#263f5e,#1a304a);color:#f6f9ff;font-weight:800;letter-spacing:.01em;box-shadow:0 5px 14px rgba(0,0,0,.16);transition:transform .16s ease,filter .16s ease,border-color .16s ease}
button:hover{filter:brightness(1.14);transform:translateY(-1px);border-color:rgba(255,255,255,.22)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.4;cursor:not-allowed;transform:none}
button.primary{background:linear-gradient(135deg,#f7d16a,#e9a92c);color:#172338;border-color:#ffe19a}
button.good{background:linear-gradient(135deg,#159a76,#087357)}
button.danger{background:linear-gradient(135deg,#a83c58,#76283f)}
header{padding:17px 20px;border-bottom:1px solid var(--line);background:rgba(5,14,25,.56);backdrop-filter:blur(18px);font-size:12px;letter-spacing:.16em;color:#dce9f8}
header b{font-weight:950}
main{max-width:1080px;margin:auto;padding:20px;display:grid;gap:16px}
.toolbar,.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.card,.team{background:linear-gradient(145deg,rgba(21,43,68,.94),rgba(10,25,43,.94));border:1px solid var(--line);border-radius:20px;padding:17px;box-shadow:var(--glow);backdrop-filter:blur(16px)}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.team{border-top:3px solid var(--blue);position:relative;overflow:hidden}
.team:after{content:"";position:absolute;inset:0 0 auto;height:100px;background:linear-gradient(180deg,rgba(255,255,255,.045),transparent);pointer-events:none}
.team.away{border-top-color:var(--red)}
.head{display:flex;align-items:center;gap:11px;position:relative;z-index:1}
.logo{width:46px;height:46px;display:grid;place-items:center;background:linear-gradient(145deg,#0a1728,#1b3451);border:1px solid rgba(255,255,255,.12);border-radius:13px;color:var(--gold);font-weight:950;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:cover}
.name{font-weight:900;font-size:19px;letter-spacing:.015em}
.score{font-size:clamp(58px,8vw,78px);line-height:1;text-align:center;font-weight:950;margin:19px 0 17px;font-variant-numeric:tabular-nums;letter-spacing:-.055em;text-shadow:0 8px 25px #0005}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions button{font-size:15px;padding:13px 10px}
.meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:11px;margin-top:13px;font-weight:750;letter-spacing:.04em}
.card h2{font-size:11px;letter-spacing:.18em;color:#a9bdd4;margin:0 0 14px;font-weight:900}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:grid;gap:7px}
.field label{font-size:10px;color:#a9bdd4;letter-spacing:.13em;font-weight:850}
input,select{width:100%;padding:12px 13px;border-radius:11px;border:1px solid rgba(173,199,228,.2);background:rgba(4,14,26,.72);color:#fff;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:#48bdf2;box-shadow:0 0 0 3px rgba(54,182,244,.14)}
input[type=color]{padding:4px;height:43px}
.wide{grid-column:1/-1}
.serve{display:flex;gap:9px}
.serve button{flex:1}
.active{outline:2px solid var(--gold);outline-offset:2px}
.chip{background:rgba(66,105,145,.25);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:11px;font-weight:800}
.note{font-size:12px;line-height:1.6;color:#9fb2c8}
.hidden{display:none!important}


/* Reference-inspired compact college-volleyball broadcast strip */
#overlayScreen{position:fixed;inset:0;background:transparent;pointer-events:none}
.stage{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);width:min(1320px,98vw)}
.bug{
 display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(220px,.78fr);
 background:linear-gradient(180deg,#f8f8f4 0%,#e2e4e1 100%);
 color:#18212a;border:1px solid rgba(15,25,35,.75);border-radius:2px;overflow:hidden;
 box-shadow:0 5px 18px rgba(0,0,0,.42);position:relative;backdrop-filter:none
}
.bug:before{content:none}
.side{display:flex;align-items:center;gap:10px;min-width:0;padding:5px 12px 4px;background:linear-gradient(180deg,#fafbf8,#dfe2df)}
.side.home{grid-column:1;grid-row:1;border-left:0;border-right:1px solid #9da5a5}
.side.away{grid-column:2;grid-row:1;justify-content:flex-start;text-align:left;border-right:1px solid #9da5a5}
.info{min-width:0;flex:1}
.teamname{font-size:clamp(15px,2.05vw,27px);font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.025em;color:#202a32;line-height:1.05}
.sets{font-size:clamp(9px,.9vw,12px);color:#647078;font-weight:750;letter-spacing:.015em;margin-top:2px}
.bigscore{font-size:clamp(30px,3.3vw,45px);font-weight:850;line-height:1;min-width:42px;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.04em;color:#202a32}
.logo{width:52px;height:48px;display:grid;place-items:center;background:#eceeeb;border:0;border-radius:0;color:#18212a;font-weight:950;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:contain}
.side.home .logo{background:#e66a35}
.side.away .logo{background:#e9ecef}
.center{grid-column:3;grid-row:1;background:linear-gradient(180deg,#f7f8f5,#dfe2df);border:0;display:flex;flex-direction:row;align-items:center;justify-content:center;padding:5px 12px}
.brand{display:none}
.setnum{font-size:clamp(14px,1.75vw,24px);font-weight:850;letter-spacing:.005em;color:#29333a;white-space:nowrap}
.serveText{font-size:0;font-weight:900;white-space:nowrap;color:#28323a;letter-spacing:0}
.serveText:empty{display:none}
.foot{grid-column:1/-1;background:linear-gradient(180deg,#d4d8d5,#c6cbc8);border-top:1px solid #aab1ae;display:flex;justify-content:center;align-items:center;flex-wrap:wrap;min-height:17px}
.foot span{font-size:9px;font-weight:800;color:#56616a;padding:2px 9px;border-right:1px solid #aab1ae;letter-spacing:.015em}
.foot .live{color:#a43b34}
.foot .state{color:#7b4f00;letter-spacing:.04em}
.flash{animation:flash .5s ease-out}
@keyframes flash{0%{transform:scale(1.18);color:#b47a00;text-shadow:0 0 12px #e9b84a}100%{transform:scale(1);color:#202a32;text-shadow:none}}
.pulse{animation:pulse .28s ease-out}
@keyframes pulse{from{opacity:.65;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:620px){
 .stage{width:99vw;bottom:4%}
 .bug{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(96px,.72fr)}
 .side{gap:5px;padding:4px 5px}
 .logo{width:31px;height:34px}
 .teamname{font-size:clamp(9px,2.6vw,14px)}
 .sets{font-size:7px}
 .bigscore{font-size:clamp(21px,5.5vw,31px);min-width:23px}
 .center{padding:4px 3px}
 .setnum{font-size:clamp(9px,2.4vw,14px);white-space:normal;text-align:center}
 .foot span{font-size:7px;padding:2px 4px}
}

</style></head><body>
